<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Liga y Playoffs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Marca de agua de fondo -->
    <div class="watermark-bg"></div>

    <!-- Nombre en la esquina superior derecha -->
    <div class="user-signature">Trez</div>

    <div class="app-container">
        <!-- Sección de Configuración Inicial -->
        <section id="config-section" class="card">
            <h2>Configuración del Torneo</h2>
            <div class="form-group">
                <label for="num-teams">Cantidad de Equipos (4 a 20):</label>
                <input type="number" id="num-teams" min="4" max="20" value="8">
            </div>
            <div class="form-group">
                <label>Nombres de los Equipos:</label>
                <div id="team-inputs-container" class="team-inputs-grid"></div>
            </div>
            <button id="start-btn" class="primary-btn">Iniciar Temporada</button>
        </section>

        <!-- Sección Principal del Torneo -->
        <section id="tournament-section" class="card hidden">
            <div class="tournament-header">
                <h2 id="current-phase-title">Fase Regular</h2>
                <div class="tournament-actions">
                    <button id="simulate-matchday-btn" class="primary-btn">Simular Jornada</button>
                    <button id="reset-tournament-btn" class="secondary-btn">Reiniciar Torneo</button>
                </div>
            </div>

            <!-- Tabla de Posiciones (Fase Regular) -->
            <div class="standings-wrapper">
                <h3>Tabla de Posiciones</h3>
                <div class="table-container">
                    <table id="standings-table">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Equipo</th>
                                <th>PJ</th>
                                <th>G</th>
                                <th>E</th>
                                <th>P</th>
                                <th>GF</th>
                                <th>GC</th>
                                <th>DG</th>
                                <th>Pts</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <!-- Partidos de la Jornada Actual -->
            <div class="matches-wrapper">
                <h3 id="matchday-title">Jornada 1</h3>
                <div id="matches-container" class="matches-grid"></div>
            </div>

            <!-- Sección de Playoffs / Bracket en Árbol -->
            <div id="playoffs-container" class="hidden">
                <h3>Fase Final - Cuartos, Semis y Final</h3>
                <div id="bracket-grid" class="bracket-grid"></div>
            </div>
        </section>
    </div>

    <!-- Alerta Personalizada -->
    <div id="custom-alert" class="modal hidden">
        <div class="modal-content">
            <p id="alert-message"></p>
            <button id="alert-ok-btn" class="primary-btn">Aceptar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
